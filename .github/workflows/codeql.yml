name: CodeQL Advanced

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  schedule:
    - cron: "19 5 * * 3"

permissions:
  security-events: write
  actions: read
  contents: read
  packages: read

jobs:
  analyze-actions:
    name: Analyze (Actions)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🔍 Initialize CodeQL
        uses: github/codeql-action/init@v4.37.8
        with:
          languages: actions
          build-mode: none

      - name: 🔎 Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.8
        with:
          category: "/language:actions"

  analyze-csharp:
    name: Analyze (C#)
    runs-on: ubuntu-latest

    if: github.event_name != 'pull_request'

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🧰 Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/*.props
            **/*.targets
            **/NuGet.config

      - name: 🛣️ Add .NET tools to PATH
        run: echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: 📦 Cache Cosmos tools
        uses: actions/cache@v6
        with:
          path: ~/.cosmos/tools
          key: ${{ runner.os }}-cosmos-v1
          restore-keys: |
            ${{ runner.os }}-cosmos-

      - name: 📦 Install Cosmos.Tools
        run: dotnet tool install -g Cosmos.Tools

      - name: ⚙️ Install Cosmos packages
        run: cosmos install -y

      - name: 🔍 Initialize CodeQL
        uses: github/codeql-action/init@v4.37.8
        with:
          languages: csharp
          build-mode: manual

      - name: 🛠 Build YKConfig
        working-directory: src/Yukihana.BuildConfig
        run: |
          dotnet restore
          dotnet build -c Release --no-restore

      - name: 📂 Initialize build configuration
        working-directory: src/Yukihana
        run: ./ykconfig init

      - name: ✒️ Configure build
        working-directory: src/Yukihana
        run: ./ykconfig configure full -v

      - name: 🚀 Build kernel
        working-directory: src/Yukihana
        run: cosmos build -v -c Release -a x64

      - name: 🔎 Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.8
        with:
          category: "/language:csharp"