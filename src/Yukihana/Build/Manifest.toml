version = 1

[metadata]
name = "Yukihana OS"
description = "Feature configuration manifest"

[[group]]
id = "kernel"
name = "Kernel"

[[group]]
id = "drivers"
name = "Drivers"

[[group]]
id = "drivers.filesystems"
name = "Filesystems"
parent = "drivers"

[[group]]
id = "debug"
name = "Debug"

[[group]]
id = "debug.logger"
name = "Logger"
parent = "debug"

# ------------------
# Features
# ------------------

[[feature]]
id = "init_ram_fs"
name = "InitRamFS"
group = "kernel"

description = "Allows kernel to load temporary filesystem from archive."

define = "FEATURE_INIT_RAM_FS"
enabled_by_default = true

[[feature]]
id = "sinks_serial"
name = "Serial Sink"
group = "debug.logger"

description = "Enables kernel to log to serial port"

define = "FEATURE_SERIAL_SINK"
enabled_by_default = true

exclude = [
    "Debug/Sinks/SerialSink.cs"
]

[[feature]]
id = "ext4"
name = "Ext4"
group = "drivers.filesystems"

description = "Enables ext4 driver"

define = "FEATURE_EXT4"

exclude = [
    "Vfs/Probe/Filesystem/Ext4Probe.cs",
    "Vfs/Filesystem/Ext4/**/*",
]